name: VYRON PSP - Nintendo 3DS Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build VYRON PSP
        run: make

      - name: Upload Nintendo 3DS build
        uses: actions/upload-artifact@v4
        with:
          name: VYRON-PSP-3DSX
          path: |
            vyron_psp.3dsx
            vyron_psp.smdh
          if-no-files-found: error
          retention-days: 14

name: VYRON PSP - Nintendo 3DS Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build VYRON PSP
        run: make

      - name: Run memory unit tests
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Isource/memory source/memory/psp_memory.c tests/test_memory.c -o /tmp/vyron-memory-tests
          /tmp/vyron-memory-tests

      - name: Run interpreter unit tests
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Isource/cpu -Isource/memory source/cpu/psp_cpu.c source/cpu/psp_interpreter.c source/cpu/psp_syscall.c source/memory/psp_memory.c tests/test_interpreter.c -o /tmp/vyron-interpreter-tests
          /tmp/vyron-interpreter-tests

      - name: Run syscall registry unit tests
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Isource/cpu -Isource/memory source/cpu/psp_syscall.c tests/test_syscall.c -o /tmp/vyron-syscall-tests
          /tmp/vyron-syscall-tests

      - name: Run PSP NID registry unit tests
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Isource/loader source/loader/psp_nid.c tests/test_nid.c -o /tmp/vyron-nid-tests
          /tmp/vyron-nid-tests

      - name: Run controller HLE dispatch unit tests
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Isource/input -Isource/cpu -Isource/memory -Isource/loader source/input/psp_controller.c source/input/psp_controller_hle.c source/input/psp_controller_hle_syscalls.c source/cpu/psp_syscall.c source/loader/psp_nid.c source/memory/psp_memory.c tests/test_controller_hle_dispatch.c -o /tmp/vyron-controller-hle-dispatch-tests
          /tmp/vyron-controller-hle-dispatch-tests

      - name: Run controller unit tests
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Isource/input source/input/psp_controller.c tests/test_controller.c -o /tmp/vyron-controller-tests
          /tmp/vyron-controller-tests

      - name: Run controller HLE unit tests
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Isource/input -Isource/memory source/input/psp_controller.c source/input/psp_controller_hle.c source/memory/psp_memory.c tests/test_controller_hle.c -o /tmp/vyron-controller-hle-tests
          /tmp/vyron-controller-hle-tests

      - name: Run controller analog unit tests
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Isource/input source/input/psp_controller.c tests/test_controller.c -o /tmp/vyron-controller-analog-tests
          /tmp/vyron-controller-analog-tests

      - name: Run loader unit tests
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Isource/loader source/loader/psp_loader.c tests/test_loader.c -o /tmp/vyron-loader-tests
          /tmp/vyron-loader-tests

      - name: Run core ELF integration tests
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Isource -Isource/cpu -Isource/memory -Isource/loader -Isource/video source/psp_core.c source/cpu/psp_cpu.c source/cpu/psp_interpreter.c source/cpu/psp_syscall.c source/memory/psp_memory.c source/loader/psp_loader.c source/loader/psp_nid.c source/input/psp_controller_hle.c source/input/psp_controller_hle_syscalls.c source/loader/psp_iso.c source/loader/psp_iso_fs.c source/input/psp_controller.c tests/test_video_stub.c tests/test_core_loader.c -o /tmp/vyron-core-loader-tests
          /tmp/vyron-core-loader-tests

      - name: Upload Nintendo 3DS build
        uses: actions/upload-artifact@v4
        with:
          name: VYRON-PSP-3DSX
          path: |
            vyron_psp.3dsx
            vyron_psp.smdh
          if-no-files-found: error
          retention-days: 14

name: VYRON PSP - Nintendo 3DS Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install devkitPro 3DS toolchain
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget https://apt.devkitpro.org/install-devkitpro-pacman
          sudo bash ./install-devkitpro-pacman
          sudo dkp-pacman -Syu --noconfirm
          sudo dkp-pacman -S --noconfirm 3ds-dev

      - name: Configure environment
        run: |
          echo "DEVKITPRO=/opt/devkitpro" >> "$GITHUB_ENV"
          echo "DEVKITARM=/opt/devkitpro/devkitARM" >> "$GITHUB_ENV"
          echo "/opt/devkitpro/devkitARM/bin" >> "$GITHUB_PATH"
          echo "/opt/devkitpro/tools/bin" >> "$GITHUB_PATH"

      - name: Build VYRON PSP
        run: make

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: vyron-psp-3ds-build
          path: |
            *.3dsx
            *.cia
            *.elf
          if-no-files-found: warn
